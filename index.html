<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Asteroid Shooter</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #050b14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  #game-canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }

  #hud {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    background: rgba(10, 20, 40, 0.85);
    border: 1px solid rgba(0, 229, 255, 0.4);
    color: #00e5ff;
    padding: 10px 24px;
    border-radius: 20px;
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    font-family: "Courier New", Courier, monospace;
    font-size: 16px;
    font-weight: bold;
    z-index: 10;
    pointer-events: none;
  }

  #game-over-modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(10, 25, 50, 0.95);
    border: 2px solid #00e5ff;
    border-radius: 16px;
    padding: 30px;
    text-align: center;
    color: #ffffff;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
    z-index: 20;
    display: none;
    min-width: 280px;
  }

  #game-over-modal h1 {
    margin: 0 0 10px 0;
    color: #ff3366;
    font-size: 28px;
    letter-spacing: 2px;
  }

  #game-over-modal p {
    font-size: 18px;
    margin: 8px 0;
    font-family: "Courier New", Courier, monospace;
  }

  #restart-btn {
    margin-top: 20px;
    background: #00e5ff;
    color: #050b14;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  #restart-btn:hover {
    background: #ffffff;
    box-shadow: 0 0 15px #00e5ff;
  }
</style>
</head>
<body>

<div id="hud">
  <div>SCORE: <span id="score-val">0</span></div>
  <div>LIVES: <span id="lives-val">3</span></div>
</div>

<div id="game-over-modal">
  <h1>GAME OVER</h1>
  <p>FINAL SCORE: <span id="final-score">0</span></p>
  <button id="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
</div>

<canvas id="game-canvas"></canvas>

<script>
  const canvas = document.getElementById("game-canvas");
  const ctx = canvas.getContext("2d");

  let width = 0;
  let height = 0;

  function resizeCanvas() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  }
  resizeCanvas();

  // --- GAME STATE ---
  let score = 0;
  let lives = 3;
  let isGameOver = false;
  let lastShootTime = 0;
  const SHOOT_INTERVAL = 140; // ms between auto-fire bullets

  // --- CONTROLS ---
  const keys = { left: false, right: false, shoot: false };
  let touchActive = false;
  let touchX = width / 2;

  // --- ENTITIES ---
  const player = {
    x: width / 2,
    y: height - 80,
    width: 36,
    height: 44,
    speed: 8
  };

  const stars = [];
  const bullets = [];
  const asteroids = [];
  const particles = [];

  // Init Parallax Stars
  for (let i = 0; i < 90; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      radius: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.8 + 0.2,
      alpha: Math.random() * 0.8 + 0.2
    });
  }

  // --- SPAWN ASTEROID ---
  let spawnTimer = 0;
  function spawnAsteroid() {
    const radius = Math.random() * 18 + 14;
    const speed = Math.random() * 2 + 1.5 + (score / 500); // Speed scales with score
    const points = [];
    const numPoints = 8;
    for (let i = 0; i < numPoints; i++) {
      const angle = (i / numPoints) * Math.PI * 2;
      const dist = radius * (0.75 + Math.random() * 0.5);
      points.push({ x: Math.cos(angle) * dist, y: Math.sin(angle) * dist });
    }

    asteroids.push({
      x: Math.random() * (width - radius * 2) + radius,
      y: -radius,
      radius: radius,
      speed: speed,
      rotation: 0,
      rotSpeed: (Math.random() - 0.5) * 0.04,
      points: points
    });
  }

  // --- PARTICLES ---
  function createExplosion(x, y, color = "#ff9900", count = 16) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: Math.random() * 2.5 + 1,
        color: color,
        life: 1.0,
        decay: Math.random() * 0.03 + 0.02
      });
    }
  }

  // --- SHOOTING ---
  function fireBullet() {
    bullets.push({
      x: player.x,
      y: player.y - player.height / 2,
      speed: 12,
      radius: 3
    });
  }

  // --- INPUT LISTENERS ---
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
    if (e.key === " " || e.key === "Spacebar") keys.shoot = true;
  });

  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
    if (e.key === " " || e.key === "Spacebar") keys.shoot = false;
  });

  // Touch Controls
  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    touchActive = true;
    touchX = e.touches[0].clientX;
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
      touchX = e.touches[0].clientX;
    }
  }, { passive: false });

  canvas.addEventListener("touchend", () => {
    touchActive = false;
  });

  // --- UPDATE & RENDER LOOP ---
  function update(now) {
    if (isGameOver) return;

    // Player position handling
    if (touchActive) {
      player.x += (touchX - player.x) * 0.2; // Smooth movement to touch location
    } else {
      if (keys.left) player.x -= player.speed;
      if (keys.right) player.x += player.speed;
    }

    // Keep ship within canvas bounds
    player.x = Math.max(player.width / 2, Math.min(width - player.width / 2, player.x));
    player.y = height - 70;

    // Auto-fire logic
    if ((keys.shoot || touchActive) && now - lastShootTime > SHOOT_INTERVAL) {
      fireBullet();
      lastShootTime = now;
    }

    // Update Stars
    for (let star of stars) {
      star.y += star.speed;
      if (star.y > height) {
        star.y = 0;
        star.x = Math.random() * width;
      }
    }

    // Update Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y -= bullets[i].speed;
      if (bullets[i].y < -10) bullets.splice(i, 1);
    }

    // Spawn Asteroids
    spawnTimer++;
    if (spawnTimer > Math.max(25, 60 - Math.floor(score / 150))) {
      spawnAsteroid();
      spawnTimer = 0;
    }

    // Update Asteroids & Collisions
    for (let aIdx = asteroids.length - 1; aIdx >= 0; aIdx--) {
      const ast = asteroids[aIdx];
      ast.y += ast.speed;
      ast.rotation += ast.rotSpeed;

      // Check collision with Player
      const distToPlayer = Math.hypot(ast.x - player.x, ast.y - player.y);
      if (distToPlayer < ast.radius + player.width / 3) {
        createExplosion(player.x, player.y, "#ff3366", 25);
        createExplosion(ast.x, ast.y, "#aaaaaa", 15);
        asteroids.splice(aIdx, 1);
        lives--;
        document.getElementById("lives-val").textContent = lives;

        if (lives <= 0) {
          endGame();
        }
        continue;
      }

      // Check collision with Bullets
      for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
        const b = bullets[bIdx];
        const distToBullet = Math.hypot(ast.x - b.x, ast.y - b.y);

        if (distToBullet < ast.radius + b.radius) {
          createExplosion(ast.x, ast.y, "#ffaa00", 16);
          asteroids.splice(aIdx, 1);
          bullets.splice(bIdx, 1);
          score += 100;
          document.getElementById("score-val").textContent = score;
          break;
        }
      }

      // Remove off-screen asteroids
      if (ast.y > height + ast.radius) {
        asteroids.splice(aIdx, 1);
      }
    }

    // Update Particles
    for (let pIdx = particles.length - 1; pIdx >= 0; pIdx--) {
      const p = particles[pIdx];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(pIdx, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    // Draw Stars Background
    for (let star of stars) {
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
      ctx.fill();
    }

    if (isGameOver) return;

    // Draw Particles
    for (let p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }

    // Draw Bullets
    ctx.fillStyle = "#00e5ff";
    ctx.shadowBlur = 8;
    ctx.shadowColor = "#00e5ff";
    for (let b of bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Draw Asteroids
    ctx.strokeStyle = "#88a0c0";
    ctx.fillStyle = "#162238";
    ctx.lineWidth = 2;
    for (let ast of asteroids) {
      ctx.save();
      ctx.translate(ast.x, ast.y);
      ctx.rotate(ast.rotation);
      ctx.beginPath();
      ctx.moveTo(ast.points[0].x, ast.points[0].y);
      for (let i = 1; i < ast.points.length; i++) {
        ctx.lineTo(ast.points[i].x, ast.points[i].y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // Draw Player Ship
    ctx.save();
    ctx.translate(player.x, player.y);

    // Ship Thruster Trail
    ctx.beginPath();
    ctx.moveTo(-6, player.height / 2);
    ctx.lineTo(0, player.height / 2 + (Math.random() * 12 + 6));
    ctx.lineTo(6, player.height / 2);
    ctx.fillStyle = "#ff5500";
    ctx.fill();

    // Ship Hull
    ctx.beginPath();
    ctx.moveTo(0, -player.height / 2);
    ctx.lineTo(player.width / 2, player.height / 2);
    ctx.lineTo(0, player.height / 4);
    ctx.lineTo(-player.width / 2, player.height / 2);
    ctx.closePath();
    ctx.fillStyle = "#00e5ff";
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#00e5ff";
    ctx.fill();
    ctx.restore();
  }

  function loop(timestamp) {
    update(timestamp);
    draw();
    requestAnimationFrame(loop);
  }

  function endGame() {
    isGameOver = true;
    document.getElementById("final-score").textContent = score;
    document.getElementById("game-over-modal").style.display = "block";
  }

  function resetGame() {
    score = 0;
    lives = 3;
    isGameOver = false;
    asteroids.length = 0;
    bullets.length = 0;
    particles.length = 0;
    player.x = width / 2;
    document.getElementById("score-val").textContent = score;
    document.getElementById("lives-val").textContent = lives;
    document.getElementById("game-over-modal").style.display = "none";
  }

  window.addEventListener("resize", () => {
    resizeCanvas();
    player.x = width / 2;
  });

  requestAnimationFrame(loop);
</script>

</body>
</html>
