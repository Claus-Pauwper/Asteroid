<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Asteroid Dodger</title>
<style>
  :root { --ctrl-h: 0px; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #area {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #wrap {
    position: relative;
    flex: none;
    width: min(100vw, calc((100vh - var(--ctrl-h)) * 4 / 3));
    width: min(100vw, calc((100dvh - var(--ctrl-h)) * 4 / 3));
    aspect-ratio: 4 / 3;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
  }

  /* CRT scanlines and vignette */
  #wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.22) 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- On-screen controls (only on touch devices) ---------- */
  #controls { display: none; z-index: 10; }
  body.touch #controls { display: flex; }

  .grp { display: flex; gap: 16px; pointer-events: none; }

  .btn {
    -webkit-appearance: none;
    appearance: none;
    width: 84px;
    height: 84px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid rgba(85, 221, 255, 0.75);
    background: rgba(20, 40, 60, 0.55);
    color: #7df;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
    box-shadow: 0 0 12px rgba(85, 221, 255, 0.35);
    font: bold 22px "Courier New", Courier, monospace;
    letter-spacing: 1px;
  }
  .btn svg { width: 36px; height: 36px; fill: currentColor; }
  .btn.down { background: rgba(85, 221, 255, 0.45); color: #fff; }

  #btnF {
    width: 104px;
    height: 104px;
    border-color: rgba(255, 85, 105, 0.85);
    color: #ff6677;
    box-shadow: 0 0 12px rgba(255, 85, 105, 0.4);
  }
  #btnF.down { background: rgba(255, 85, 105, 0.45); color: #fff; }

  @media (orientation: portrait) {
    body.touch { --ctrl-h: 170px; }
    body.touch #controls {
      flex: none;
      width: 100%;
      height: var(--ctrl-h);
      box-sizing: border-box;
      padding: 0 20px;
      justify-content: space-between;
      align-items: center;
    }
  }

  @media (orientation: landscape) {
    body.touch #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      box-sizing: border-box;
      padding: 0 max(18px, env(safe-area-inset-right)) 14px max(18px, env(safe-area-inset-left));
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }
  }

  @media (max-height: 500px) {
    .btn { width: 70px; height: 70px; }
    .btn svg { width: 30px; height: 30px; }
    #btnF { width: 88px; height: 88px; }
  }
</style>
</head>
<body>
<div id="area">
  <div id="wrap"><canvas id="c"></canvas></div>
</div>

<div id="controls">
  <div class="grp">
    <button class="btn" id="btnL" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M16 4 L6 12 L16 20 Z"/></svg></button>
    <button class="btn" id="btnR" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M8 4 L18 12 L8 20 Z"/></svg></button>
  </div>
  <button class="btn" id="btnF" aria-label="Fire">FIRE</button>
</div>

<script>
// ------------------------------------------------------------
// SETUP
// ------------------------------------------------------------
const W = 800, H = 600;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
cv.width = W;
cv.height = H;

// Touch device detection (add ?touch to the URL to preview the buttons on a desktop)
const isTouch = window.matchMedia("(pointer: coarse)").matches || /[?&]touch\b/.test(location.search);
if (isTouch) document.body.classList.add("touch");
const GLOW = isTouch ? 0.4 : 1;   // lighter glow on phones for smoother frame rate

const FONT = '"Courier New", Courier, monospace';

// Start / game over picture (must sit in the same folder as this file)
const img = new Image();
let imgOK = false;
img.onload = () => { imgOK = true; };
img.src = "start_screen.jpg";

// Game settings (same values as the Pygame version)
const ROCKET_SPEED = 5;
const BULLET_SPEED = 10;
const SHOOT_COOLDOWN = 10;            // frames
const SPAWN_DELAY = 60;               // frames
const SPEED_MIN = 2, SPEED_MAX = 5;
const LEVEL_INTERVAL = 20;            // score step for speed up
const LEVEL_BOOST = 0.2;              // +20% per level
const START_LIVES = 3;
const SIZES  = { small: 20, medium: 40, large: 60 };
const HEALTH = { small: 1,  medium: 2,  large: 3  };

// ------------------------------------------------------------
// AUDIO (simple arcade beeps, no files needed)
// ------------------------------------------------------------
let AC = null, muted = false;
function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function beep(freq, dur, type = "square", vol = 0.05, slide = 0) {
  if (muted) return;
  try {
    const a = getAC();
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g);
    g.connect(a.destination);
    o.start();
    o.stop(a.currentTime + dur);
  } catch (e) {}
}
function boomSound(power = 1) {
  if (muted) return;
  try {
    const a = getAC();
    const len = Math.floor(a.sampleRate * 0.3 * power);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource();
    const g = a.createGain();
    s.buffer = buf;
    g.gain.value = 0.12;
    s.connect(g);
    g.connect(a.destination);
    s.start();
  } catch (e) {}
}

// ------------------------------------------------------------
// STATE
// ------------------------------------------------------------
let state = "title";            // title | play | over
let paused = false;
let score = 0, lives = START_LIVES, level = 0;
let ship, asteroids, bullets, sparks;
let spawnT = 0, shootCd = 0, invuln = 0, bannerT = 0, hintT = 0, overT = 0, tick = 0;
let newHigh = false;
let fireQueued = false;         // one shot per tap on the touch FIRE button

let hi = 0;
try { hi = Number(localStorage.getItem("asteroidDodgerHi")) || 0; } catch (e) {}

const stars = [];
for (let i = 0; i < 90; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 0.6 + 0.15, b: Math.random() * 0.6 + 0.3 });
}

const keys = { left: false, right: false, fire: false };

function resetGame() {
  score = 0; lives = START_LIVES; level = 0;
  ship = { x: W / 2, y: H - 55 };
  asteroids = []; bullets = []; sparks = [];
  spawnT = 0; shootCd = 0; invuln = 0; bannerT = 0; hintT = 240; newHigh = false;
  fireQueued = false;
}
resetGame();

// ------------------------------------------------------------
// INPUT
// ------------------------------------------------------------
function startIfIdle() {
  if (state === "title" || (state === "over" && overT > 45)) {
    resetGame();
    state = "play";
    paused = false;
    beep(660, 0.15, "square", 0.06, 400);
    return true;
  }
  return false;
}

// Keyboard
window.addEventListener("keydown", (e) => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
  if (e.key === "ArrowLeft") keys.left = true;
  if (e.key === "ArrowRight") keys.right = true;
  if (e.key === " ") {
    keys.fire = true;
    if (!e.repeat) startIfIdle();
  }
  if (e.key === "m" || e.key === "M") muted = !muted;
  if ((e.key === "p" || e.key === "P") && state === "play") paused = !paused;
});
window.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft") keys.left = false;
  if (e.key === "ArrowRight") keys.right = false;
  if (e.key === " ") keys.fire = false;
});
window.addEventListener("blur", () => { keys.left = keys.right = keys.fire = false; });

// Touch / pointer buttons
function bindBtn(el, down, up) {
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.classList.add("down");
    down();
  });
  const release = () => { el.classList.remove("down"); up(); };
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
  el.addEventListener("lostpointercapture", release);
}
bindBtn(document.getElementById("btnL"), () => { keys.left = true; },  () => { keys.left = false; });
bindBtn(document.getElementById("btnR"), () => { keys.right = true; }, () => { keys.right = false; });
bindBtn(document.getElementById("btnF"), () => {
  if (startIfIdle()) return;
  if (paused) { paused = false; return; }
  fireQueued = true;
}, () => {});

// Tap the screen to start, restart or resume
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (startIfIdle()) return;
  if (paused) paused = false;
});

// Pause automatically when the page is hidden (app switch, lock screen)
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "play") paused = true;
  keys.left = keys.right = keys.fire = false;
});

// No long-press context menu on phones
window.addEventListener("contextmenu", (e) => e.preventDefault());

// ------------------------------------------------------------
// GAME LOGIC (fixed 60 Hz step)
// ------------------------------------------------------------
function spawnAsteroid() {
  const type = ["small", "medium", "large"][Math.floor(Math.random() * 3)];
  const r = SIZES[type];
  const mult = 1 + level * LEVEL_BOOST;
  const n = 9 + Math.floor(Math.random() * 4);
  const pts = [];
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2;
    const d = r * (0.7 + Math.random() * 0.3);
    pts.push({ x: Math.cos(ang) * d, y: Math.sin(ang) * d });
  }
  asteroids.push({
    x: r + Math.random() * (W - 2 * r),
    y: -r,
    r: r,
    vy: (SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN)) * mult,
    rot: 0,
    vr: (Math.random() - 0.5) * 0.06,
    hp: HEALTH[type],
    max: HEALTH[type],
    flash: 0,
    pts: pts
  });
}

function boom(x, y, r, color) {
  const count = 10 + Math.floor(r / 2);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 3.5 + 0.8;
    sparks.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      ang: a, len: Math.random() * 8 + 3,
      life: 1, decay: Math.random() * 0.025 + 0.02,
      color: color
    });
  }
}

function addScore(n) {
  score += n;
  const lv = Math.floor(score / LEVEL_INTERVAL);
  if (lv > level) {
    level = lv;
    bannerT = 120;
    beep(300, 0.4, "square", 0.06, 600);
  }
}

function endGame() {
  state = "over";
  overT = 0;
  fireQueued = false;
  if (score > hi) {
    hi = score;
    newHigh = true;
    try { localStorage.setItem("asteroidDodgerHi", String(hi)); } catch (e) {}
  }
}

function step() {
  tick++;

  // stars always scroll
  for (const s of stars) {
    s.y += s.s;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }

  // sparks (harmless debris effect)
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) sparks.splice(i, 1);
  }

  if (state === "over") { overT++; return; }
  if (state !== "play" || paused) return;

  // ship
  if (keys.left) ship.x -= ROCKET_SPEED;
  if (keys.right) ship.x += ROCKET_SPEED;
  ship.x = Math.max(20, Math.min(W - 20, ship.x));
  if (invuln > 0) invuln--;
  if (hintT > 0) hintT--;

  // shooting: keyboard can hold, touch button fires once per tap
  if (shootCd > 0) shootCd--;
  if ((keys.fire || fireQueued) && shootCd === 0) {
    bullets.push({ x: ship.x, y: ship.y - 26 });
    shootCd = SHOOT_COOLDOWN;
    fireQueued = false;
    beep(880, 0.08, "square", 0.03, -500);
  }

  // spawn
  spawnT++;
  if (spawnT >= SPAWN_DELAY) { spawnAsteroid(); spawnT = 0; }

  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y -= BULLET_SPEED;
    if (bullets[i].y < -15) bullets.splice(i, 1);
  }

  // asteroids
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    a.y += a.vy;
    a.rot += a.vr;
    if (a.flash > 0) a.flash--;

    // bullet hits
    let destroyed = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(a.x - b.x, a.y - b.y) < a.r + 2) {
        bullets.splice(j, 1);
        a.hp--;
        a.flash = 5;
        if (a.hp <= 0) {
          boom(a.x, a.y, a.r, "#ffb347");
          boomSound(a.r / 40);
          addScore(1);
          asteroids.splice(i, 1);
          destroyed = true;
        } else {
          boom(b.x, b.y, 8, "#ffffff");
          beep(200, 0.08, "sawtooth", 0.05, -100);
        }
        break;
      }
    }
    if (destroyed) continue;

    // ship hit
    if (invuln === 0 && Math.hypot(a.x - ship.x, a.y - ship.y) < a.r * 0.85 + 14) {
      boom(ship.x, ship.y, 30, "#ff5577");
      boom(a.x, a.y, a.r, "#ffb347");
      boomSound(1.5);
      asteroids.splice(i, 1);
      lives--;
      if (lives <= 0) { endGame(); return; }
      invuln = 120;
      continue;
    }

    // passed the bottom
    if (a.y - a.r > H) {
      asteroids.splice(i, 1);
      addScore(1);
    }
  }

  if (bannerT > 0) bannerT--;
}

// ------------------------------------------------------------
// DRAWING
// ------------------------------------------------------------
function txt(s, x, y, size, color, align = "center", glow = true) {
  ctx.font = "bold " + size + "px " + FONT;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 10 * GLOW; }
  ctx.fillText(s, x, y);
  ctx.shadowBlur = 0;
}
const pad = (n, l = 4) => String(n).padStart(l, "0");

function drawShipShape(x, y, color, flame) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.shadowColor = "#4df";
  ctx.shadowBlur = 10 * GLOW;
  ctx.beginPath();
  ctx.moveTo(0, -26);
  ctx.lineTo(9, -8);
  ctx.lineTo(9, 12);
  ctx.lineTo(20, 24);
  ctx.lineTo(9, 20);
  ctx.lineTo(-9, 20);
  ctx.lineTo(-20, 24);
  ctx.lineTo(-9, 12);
  ctx.lineTo(-9, -8);
  ctx.closePath();
  ctx.stroke();
  // nose accent
  ctx.strokeStyle = "#ff4455";
  ctx.beginPath();
  ctx.moveTo(-9, -8);
  ctx.lineTo(9, -8);
  ctx.stroke();
  if (flame) {
    ctx.strokeStyle = "#ff9922";
    ctx.shadowColor = "#ff9922";
    ctx.beginPath();
    ctx.moveTo(-5, 21);
    ctx.lineTo(0, 22 + Math.random() * 14);
    ctx.lineTo(5, 21);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBackdrop() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.fillStyle = "rgba(255,255,255," + s.b + ")";
    ctx.fillRect(s.x, s.y, s.s > 0.5 ? 2 : 1, s.s > 0.5 ? 2 : 1);
  }
}

function drawPicture(dim) {
  if (imgOK) {
    ctx.drawImage(img, 0, 0, W, H);
  } else {
    drawBackdrop();
  }
  if (dim > 0) {
    ctx.fillStyle = "rgba(0,0,0," + dim + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

function drawHUD() {
  txt("SCORE " + pad(score), 20, 24, 22, "#ffffff", "left");
  txt("HI " + pad(hi), W / 2, 24, 22, "#ffdd55", "center");
  txt("LEVEL " + (level + 1), W - 20, 24, 22, "#55ff99", "right");
  for (let i = 0; i < lives; i++) {
    ctx.save();
    ctx.scale(0.45, 0.45);
    drawShipShape((28 + i * 30) / 0.45, 62 / 0.45, "#ffffff", false);
    ctx.restore();
  }
}

function drawPlay() {
  drawBackdrop();

  // asteroids
  for (const a of asteroids) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.strokeStyle = a.flash > 0 ? "#ffee66" : "#dddddd";
    ctx.shadowColor = a.flash > 0 ? "#ffee66" : "#99aabb";
    ctx.shadowBlur = 8 * GLOW;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(a.pts[0].x, a.pts[0].y);
    for (let i = 1; i < a.pts.length; i++) ctx.lineTo(a.pts[i].x, a.pts[i].y);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // hit point pips for medium and large
    if (a.max > 1) {
      for (let k = 0; k < a.hp; k++) {
        ctx.fillStyle = "#ff5577";
        ctx.fillRect(a.x - (a.max * 7) / 2 + k * 7, a.y - a.r - 12, 5, 5);
      }
    }
  }

  // bullets
  ctx.strokeStyle = "#ffff66";
  ctx.shadowColor = "#ffff66";
  ctx.shadowBlur = 8 * GLOW;
  ctx.lineWidth = 3;
  for (const b of bullets) {
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x, b.y + 12);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // sparks
  ctx.lineWidth = 2;
  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.strokeStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - Math.cos(p.ang) * p.len, p.y - Math.sin(p.ang) * p.len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // ship (blinks while invulnerable)
  if (invuln === 0 || Math.floor(invuln / 6) % 2 === 0) {
    drawShipShape(ship.x, ship.y, "#ffffff", true);
  }

  drawHUD();

  if (bannerT > 0 && Math.floor(bannerT / 8) % 2 === 0) {
    txt("SPEED UP!", W / 2, 200, 44, "#ff5577");
  }
  if (hintT > 0) {
    const hint = isTouch ? "USE THE BUTTONS TO MOVE AND FIRE" : "ARROWS: MOVE    SPACE: FIRE    P: PAUSE    M: SOUND";
    txt(hint, W / 2, H - 14, 16, "#aaaaaa", "center", false);
  }
  if (paused) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, 0, W, H);
    txt("PAUSED", W / 2, H / 2, 48, "#ffffff");
    if (isTouch) txt("TAP TO RESUME", W / 2, H / 2 + 50, 22, "#55ddff");
  }
}

function drawTitle() {
  drawPicture(0);
  if (!imgOK) {
    txt("ASTEROID DODGER", W / 2, 170, 56, "#ffcc33");
    txt("FLY FAST! DODGE DANGER! BLAST ROCKS!", W / 2, 240, 20, "#ffffff");
    if (Math.floor(tick / 30) % 2 === 0) txt(isTouch ? "TAP TO START" : "HIT SPACE TO START", W / 2, 400, 32, "#55ddff");
    txt("put start_screen.jpg next to this file for the picture", W / 2, H - 20, 14, "#777777", "center", false);
  }
  if (hi > 0) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(14, 14, 190, 30);
    txt("HI-SCORE " + pad(hi), 24, 29, 18, "#ffdd55", "left");
  }
}

function drawOver() {
  drawPicture(0.72);
  txt("GAME OVER", W / 2, 170, 72, "#ff3355");
  txt("SCORE " + pad(score), W / 2, 270, 34, "#ffffff");
  txt("HI-SCORE " + pad(hi), W / 2, 318, 26, "#ffdd55");
  if (newHigh && Math.floor(tick / 15) % 2 === 0) txt("NEW HIGH SCORE!", W / 2, 370, 28, "#55ff99");
  if (overT > 45 && Math.floor(tick / 30) % 2 === 0) txt(isTouch ? "TAP TO RESTART" : "HIT SPACE TO RESTART", W / 2, 470, 30, "#55ddff");
}

function draw() {
  if (state === "title") drawTitle();
  else if (state === "play") drawPlay();
  else drawOver();
}

// ------------------------------------------------------------
// MAIN LOOP
// ------------------------------------------------------------
let last = performance.now(), acc = 0;
const DT = 1000 / 60;
function frame(t) {
  acc += Math.min(100, t - last);
  last = t;
  while (acc >= DT) { step(); acc -= DT; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
